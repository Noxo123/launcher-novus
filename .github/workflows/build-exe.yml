name: Build launcher-novus EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci
          } else {
            npm install
          }

      - name: Build Windows EXE
        shell: pwsh
        run: npm run build -- --publish never

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter *.exe -File -ErrorAction SilentlyContinue
          if (-not $exe) {
            Write-Error 'Aucun fichier EXE n''a été généré dans dist/.'
            exit 1
          }
          Write-Host 'EXE généré :'
          $exe | ForEach-Object { Write-Host "$($_.FullName) - $($_.Length) bytes" }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: launcher-novus-windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Novus Launcher v0.1.${{ github.run_number }}
          generate_release_notes: true
          files: dist/*.exe
          fail_on_unmatched_files: true
